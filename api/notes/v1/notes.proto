syntax = "proto3";

option go_package = "github.com/ArtamonovEvgenii/grpc-course-2025/pkg/api/notes/v1";

import "google/type/datetime.proto";

package api.notes.v1;


service Notes {
  rpc CreateNote(CreateNoteRequest) returns(CreateNoteResponse) {}
  rpc GetNotesList(GetNotesListRequest) returns(GetNotesListResponse) {}
  rpc GetNote(GetNoteRequest) returns(GetNoteResponse) {}
  rpc UpdateNote(UpdateNoteRequest) returns(UpdateNoteResponse) {}
  rpc DeleteNote(DeleteNoteRequest) returns(DeleteNoteResponse) {}
}

message CreateNoteRequest {
      string title = 1;
      string text = 2;
}

message CreateNoteResponse{
  string uuid = 1;
}

message GetNotesListRequest{

}

message GetNotesListResponseNote {
  string uuid = 1;
  string title = 2;
  google.type.DateTime updated_at = 3;
}

message GetNotesListResponse{
  repeated GetNotesListResponseNote notes = 1;
}

message GetNoteRequest {
  string uuid = 1;
}

message GetNoteResponse {
  string uuid = 1;
  string title = 2;
  string text = 3;
  google.type.DateTime crated_at = 4;
  google.type.DateTime updated_at = 5;
}

message UpdateNoteRequest {
  string uuid = 1;
  string title = 2;
  string text = 3;
}

message UpdateNoteResponse {}

message DeleteNoteRequest {
  string uuid = 1;
}

message DeleteNoteResponse {}